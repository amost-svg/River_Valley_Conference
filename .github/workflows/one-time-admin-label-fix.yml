name: One-time Admin Label Fix

on:
  push:
    branches:
      - fix/result-submission-timestamp

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/result-submission-timestamp
          fetch-depth: 0
      - name: Apply narrow sport label type guard
        shell: python
        run: |
          from pathlib import Path
          path = Path("client/src/pages/AdminDashboardV2.tsx")
          content = path.read_text()
          old = '''function sportLabel(sport?: Sport | CalendarGame) {
            if (!sport) return "Conference";
            return sport.gender_label && sport.gender_label !== "Coed" ? `${sport.gender_label} ${sport.name ?? sport.sport_name}` : (sport.name ?? sport.sport_name);
          }'''
          new = '''function sportLabel(sport?: Sport | CalendarGame) {
            if (!sport) return "Conference";
            const name = "sport_name" in sport ? sport.sport_name : sport.name;
            return sport.gender_label && sport.gender_label !== "Coed" ? `${sport.gender_label} ${name}` : name;
          }'''
          if old not in content:
            raise SystemExit("Expected sportLabel source was not found.")
          path.write_text(content.replace(old, new))
      - name: Commit exact source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/AdminDashboardV2.tsx
          git commit -m "fix: narrow dashboard sport label type"
          git push origin HEAD:fix/result-submission-timestamp
